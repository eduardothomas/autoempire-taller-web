# CI base para GitHub Actions. Ajustar comandos al stack del proyecto.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
